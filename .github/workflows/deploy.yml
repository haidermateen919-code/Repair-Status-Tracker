name: Deploy

# Runs on GitHub's runners, which have unrestricted internet access (the agent
# sandbox cannot reach the Vercel API). Every push to main provisions the
# database and ships to production; `workflow_dispatch` re-deploys on demand.
on:
  workflow_dispatch:
    inputs:
      provision:
        description: "Apply migrations and seed the shop/owner before deploying"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "drizzle/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tailwind.config.ts"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision database and deploy to Vercel
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: repair-status-tracker
      # One dotenv-formatted secret keeps the manual setup to a single paste.
      PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Load production configuration
        run: |
          if [ -z "$PRODUCTION_ENV" ]; then
            echo "::error::The PRODUCTION_ENV secret is missing. See DEPLOY.md."
            exit 1
          fi
          printf '%s\n' "$PRODUCTION_ENV" > .env
          chmod 600 .env
          # Parse KEY=value without shell evaluation, tolerating quoted values
          # (connection strings contain ? & = and must not be interpreted).
          while IFS='=' read -r key value; do
            case "$key" in ''|'#'*) continue ;; esac
            value="${value%\"}"; value="${value#\"}"
            value="${value%\'}"; value="${value#\'}"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done < .env

          missing=0
          for key in DATABASE_URL AUTH_SECRET SEED_OWNER_EMAIL SEED_OWNER_PASSWORD SHOP_NAME SHOP_PHONE SHOP_WHATSAPP; do
            if [ -z "${!key}" ]; then echo "::error::PRODUCTION_ENV is missing $key"; missing=1; fi
          done
          [ -z "$VERCEL_TOKEN" ] && { echo "::error::The VERCEL_TOKEN secret is missing."; missing=1; }
          exit $missing

      - run: npm ci

      - name: Quality gate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Apply migrations and seed the shop
        if: ${{ github.event_name == 'push' || inputs.provision }}
        run: npm run provision

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Create or link the Vercel project
        run: |
          # `project create` fails harmlessly when the project already exists.
          vercel project create "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Sync runtime environment variables
        run: |
          # Secrets are stored as sensitive; plain values as readable config.
          sync_secret() {
            [ -z "${!1}" ] && return 0
            vercel env add "$1" production --force --sensitive --value "${!1}" \
              --token "$VERCEL_TOKEN" --yes >/dev/null
            echo "synced $1 (secret)"
          }
          sync_config() {
            [ -z "${!1}" ] && return 0
            vercel env add "$1" production --force --type config --value "${!1}" \
              --token "$VERCEL_TOKEN" --yes >/dev/null
            echo "synced $1"
          }

          sync_secret DATABASE_URL
          sync_secret AUTH_SECRET
          sync_secret SEED_OWNER_PASSWORD
          sync_config APP_BASE_URL
          sync_config SHOP_NAME
          sync_config SHOP_PHONE
          sync_config SHOP_WHATSAPP
          sync_config SHOP_ADDRESS
          sync_config SHOP_TIMINGS

      - name: Build
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed"
            echo ""
            echo "- URL: $url"
            echo "- Owner area: $url/login"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live deployment
        run: |
          url="${{ steps.deploy.outputs.url }}"
          code=""
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/login" || true)
            echo "attempt $attempt: /login -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200" || { echo "::error::Deployment did not serve /login"; exit 1; }

          # Public surfaces must stay out of search engines.
          curl -s -D - -o /dev/null "$url/track" | grep -qi 'x-robots-tag: noindex' \
            || { echo "::error::/track is missing X-Robots-Tag: noindex"; exit 1; }

          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke tests passed for $url" >> "$GITHUB_STEP_SUMMARY"
